spring.application.name = keepinventory-backend

# ===== Variables de entorno locales =====
# Carga el archivo .env (si existe) como si fueran propiedades. Ahí van los secretos
# de desarrollo (ej. DB_PASSWORD); .env está en .gitignore y NUNCA se sube a git.
# Se buscan dos rutas porque el proceso puede arrancar desde keepinventory-backend/
# (./mvnw) o desde la raíz del repositorio (VS Code). Ver .env.example.
spring.config.import = optional:file:.env[.properties],optional:file:keepinventory-backend/.env[.properties]

# ===== Servidor =====
# Los hostings (ej. Render) indican en PORT el puerto donde debe escuchar la app; en local, 8080.
server.port = ${PORT:8080}

# ===== Base de datos =====
# En producción se definen DB_URL, DB_USERNAME y DB_PASSWORD en el hosting.
# DB_PASSWORD no tiene valor por defecto a propósito: la contraseña nunca va en el código.
spring.datasource.url = ${DB_URL:jdbc:postgresql://localhost:5432/inventory_management}
spring.datasource.username = ${DB_USERNAME:postgres}
spring.datasource.password = ${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = update

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql = true

# ===== JWT =====
# Clave secreta para firmar los tokens (Base64, mínimo 256 bits para HS256).
# Se toma de la variable de entorno JWT_SECRET; el valor después de ":" es solo para desarrollo.
# En producción SIEMPRE definir JWT_SECRET (generar con: openssl rand -base64 32).
jwt.secret = ${JWT_SECRET:FWIYwbjKOqdR9DmWj7uszQDLYSH4QQ7iFpadj+j9Bf8=}
# Tiempo de vida del token en milisegundos (86400000 ms = 24 horas)
jwt.expiration = 86400000

# ===== CORS =====
# Frontends autorizados a llamar a la API (separados por coma). 4200 = Angular en desarrollo.
app.cors.allowed-origins = ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
