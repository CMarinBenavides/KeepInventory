<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Corazones">
  <!-- Ilustración del easter egg de gaby. Se puede reemplazar por una foto
       (ej. amor.jpg) cambiando también el src en home.html -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4ec"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="corazon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <!-- Forma de corazón reutilizable, centrada en (0,0) -->
    <path id="c" d="M0 12 C-18 -2 -26 -14 -18 -24 C-11 -32 -2 -29 0 -21 C2 -29 11 -32 18 -24 C26 -14 18 -2 0 12 Z"/>
  </defs>
  <rect width="320" height="220" rx="16" fill="url(#fondo)"/>

  <!-- Corazones pequeños de fondo -->
  <g fill="#f9a8d4">
    <use href="#c" transform="translate(40 50) scale(0.6)"/>
    <use href="#c" transform="translate(280 45) scale(0.7) rotate(12)"/>
    <use href="#c" transform="translate(60 180) scale(0.5) rotate(-15)"/>
    <use href="#c" transform="translate(265 175) scale(0.55) rotate(-8)"/>
    <use href="#c" transform="translate(150 30) scale(0.4)"/>
  </g>

  <!-- Dos corazones grandes juntos -->
  <use href="#c" transform="translate(135 125) scale(2.6) rotate(-10)" fill="#fda4af"/>
  <use href="#c" transform="translate(180 120) scale(3) rotate(8)" fill="url(#corazon)"/>

  <!-- Brillo -->
  <ellipse cx="160" cy="75" rx="9" ry="5" fill="#fff" opacity="0.6" transform="rotate(-30 160 75)"/>
</svg>
