<!doctype html>
<!-- Única página HTML de la app (SPA: Single Page Application).
     Angular no recarga la página al navegar: cambia el contenido dentro de <app-root>. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Título por defecto; el router lo reemplaza con el "title" de cada ruta (app.routes.ts) -->
  <title>KeepInventory</title>
  <!-- Ruta base que usa el router para construir las URLs (/login, /, ...) -->
  <base href="/">
  <!-- Hace que la página se adapte al ancho de celulares y tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Aplica el tema guardado ANTES de que se dibuje la página. Angular tarda unos
       milisegundos en arrancar; sin esto, en modo oscuro se vería un destello blanco.
       Usa la misma lógica y la misma clave que ThemeService. -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('keepinventory_theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Aquí Angular dibuja el componente raíz (App, selector 'app-root') -->
  <app-root></app-root>
</body>
</html>
